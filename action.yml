# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: "Build Tartaria ISO Action"
description: "Builds a Tartaria ISO from a container image using the start.sh script."
inputs:
  container-image:
    description: "Container image to use for the squashfs rootfs"
    required: true
  iso-path:
    description: "Path to move the resulting ISO to"
    required: true

outputs:
  iso-path:
    description: "Path to the resulting ISO file"
    value: ${{ steps.move-iso.outputs.iso-path }}

runs:
  using: "composite"
  steps:
    - name: Build ISO
      run: |
        sudo ${{ github.action_path }}/start.sh ${{ inputs.container-image }} ${{ github.action_path }}/out/
        
        mkdir -p "$(dirname ${{ inputs.iso-path }})"
        sudo chown $(whoami):$(whoami) ${{ github.action_path }}/out/cuckoo.iso
        sudo mv ${{ github.action_path }}/out/cuckoo.iso "${{ inputs.iso-path }}"
        echo "iso-path=$(realpath ${{ inputs.iso-path }})" >> $GITHUB_OUTPUT
      shell:
        bash
